name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build Web
        run: |
          npm ci
          npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      # 初测阶段：构建 debug APK（debug 自动签名，可直接安装，无需 secrets）
      - name: Build Gradle Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      # 发布冒烟验证门禁：校验 APK 存在与包信息，验证不通过则发布失败
      - name: Smoke Check APK (aapt verify)
        working-directory: ./android
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK=$APK"
          test -n "$APK"
          aapt dump badging "$APK" | head -3

      - name: Rename APK
        run: |
          mv "$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)" \
             "android/app/build/outputs/apk/debug/MasterAnki-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/MasterAnki-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
